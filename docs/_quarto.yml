project:
  type: website

website:
  title: "linkrot"
  reader-mode: true
  repo-url: https://github.com/coatless-quarto/linkrot/
  repo-actions: [edit, issue]
  sidebar:
    logo: "linkrot-animated-logo.svg"
    logo-alt: "A hexagon logo for the linkrot extension."
    style: "floating"
    search: true
    tools:
      - icon: github
        href: https://github.com/coatless-quarto/linkrot/
    contents: 
      - text: "Home"
        file: index.qmd
      - section: "Support"
        contents:
        - text: "Demo"
          href: qlinkrot-example.qmd
      - section: "Support"
        contents:
        - text: "FAQ"
          href: qlinkrot-faq.qmd
        - text: "Submit an issue"
          href: https://github.com/coatless-quarto/linkrot/issues/new/choose
      - section: "Extra"
        contents:
        - qlinkrot-release-notes.qmd
        - href: https://blog.thecoatlessprofessor.com/projects/linkrot/
          text: "Blog posts"

callout-appearance: simple

format: 
  html:
    toc: true